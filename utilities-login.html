<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digifinwiz Utilities - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-page auth-page--utilities">
        <div class="auth-bg-decor" aria-hidden="true">
            <div class="auth-blob auth-blob-1"></div>
            <div class="auth-blob auth-blob-2"></div>
            <div class="auth-blob auth-blob-3"></div>
            <svg class="auth-motif auth-motif-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.6"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
            <svg class="auth-motif auth-motif-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.6"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        </div>

        <div class="auth-utilities-stack">
            <div class="auth-solid-card">
                <div class="login-header">
                    <h1 class="login-logo">Digifinwiz Utilities</h1>
                    <p>Welcome back! Please login to your utilities account</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label>Username or Email</label>
                        <input type="text" class="form-input" id="loginUsername" placeholder="Enter your username or email" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                    </div>

                    <!-- Inline error message -->
                    <div id="loginError" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:0.75rem 1rem;font-size:0.875rem;margin-bottom:1rem"></div>

                    <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Login</button>
                </form>

                <div class="login-footer" style="margin-top:1.5rem;text-align:center">
                    <p>Don't have a utilities account? <a href="utilities-register.html" style="color:#6366f1;font-weight:600">Sign up here</a></p>
                </div>

                <!-- Dev hint -->
                <div class="auth-dev-hint">
                    Default admin: <strong>admin</strong> / <strong>Admin1234</strong>
                </div>
            </div>

            <div class="auth-chip-strip">
                <div class="auth-chip">⚡ Electricity</div>
                <div class="auth-chip">💧 Water</div>
                <div class="auth-chip">🌐 Internet</div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>window.APP_MODULE = 'utilities';</script>
    <script src="module-auth.js"></script>
    <script src="db.js"></script>
    <script>
        var loginError = document.getElementById('loginError');
        var loginBtn   = document.getElementById('loginBtn');

        function showError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }

        function hideError() {
            loginError.style.display = 'none';
        }

        DigifinwizDB.init().catch(function(err) {
            console.error('DB init error:', err);
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            var usernameOrEmail = document.getElementById('loginUsername').value.trim();
            var password        = document.getElementById('loginPassword').value;

            if (!usernameOrEmail || !password) {
                showError('Please enter your username/email and password.');
                return;
            }

            loginBtn.disabled    = true;
            loginBtn.textContent = 'Logging in...';

            DigifinwizDB.moduleLogin('utilities', usernameOrEmail, password).then(function(result) {
                if (!result.success) {
                    loginBtn.disabled    = false;
                    loginBtn.textContent = 'Login';
                    switch (result.reason) {
                        case 'not_found':
                            showError('No utilities account found with that username or email.');
                            break;
                        case 'wrong_password':
                            showError('Incorrect password. Please try again.');
                            break;
                        default:
                            showError('Login failed. Please try again.');
                    }
                    return;
                }

                DigifinwizModuleAuth.setSession(result.user);
                window.location.replace('utilities.html');
            }).catch(function(err) {
                console.error('Login error:', err);
                loginBtn.disabled    = false;
                loginBtn.textContent = 'Login';
                showError('An error occurred. Please try again.');
            });
        });
    </script>
</body>
</html>
