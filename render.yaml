databases:
  - name: digifinwiz-db
    plan: free
    region: oregon

services:
  - type: web
    name: digifinwiz
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: digifinwiz-db
          property: connectionString
      # Password for the seeded admin accounts (read once, when they are first
      # created). Set it in the dashboard; it is deliberately not in this file.
      - key: ADMIN_PASSWORD
        sync: false
    autoDeploy: true
