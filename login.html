<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digifinwiz - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-page auth-page--brand">
        <div class="auth-bg-decor" aria-hidden="true">
            <div class="auth-blob auth-blob-1"></div>
            <div class="auth-blob auth-blob-2"></div>
            <div class="auth-blob auth-blob-3"></div>
            <svg class="auth-motif auth-motif-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.6"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
            <svg class="auth-motif auth-motif-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.6"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        </div>

        <div class="auth-glass-card">
            <div class="login-header">
                <h1 class="login-logo">Digifinwiz</h1>
                <p>Welcome back! Please login to your account</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" class="form-input" id="loginUsername" placeholder="Enter your username or email" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <!-- Inline error message -->
                <div id="loginError" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:0.75rem 1rem;font-size:0.875rem;margin-bottom:1rem"></div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Login</button>
            </form>

            <div class="login-footer" style="margin-top:1.5rem;text-align:center">
                <p>Don't have an account? <a href="register.html" style="color:#6366f1;font-weight:600">Sign up here</a></p>
            </div>

            <!-- Dev hint -->
            <div class="auth-dev-hint">
                Default admin: <strong>admin</strong> / <strong>Admin1234</strong>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="db.js"></script>
    <script>
        var loginError = document.getElementById('loginError');
        var loginBtn   = document.getElementById('loginBtn');

        function showError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }

        function hideError() {
            loginError.style.display = 'none';
        }

        // Initialise DB on page load (ensures default admin is seeded)
        DigifinwizDB.init().catch(function(err) {
            console.error('DB init error:', err);
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            hideError();

            var usernameOrEmail = document.getElementById('loginUsername').value.trim();
            var password        = document.getElementById('loginPassword').value;

            if (!usernameOrEmail || !password) {
                showError('Please enter your username/email and password.');
                return;
            }

            loginBtn.disabled    = true;
            loginBtn.textContent = 'Logging in...';

            DigifinwizDB.authenticateUser(usernameOrEmail, password).then(function(result) {
                if (!result.success) {
                    loginBtn.disabled    = false;
                    loginBtn.textContent = 'Login';
                    switch (result.reason) {
                        case 'not_found':
                            showError('No account found with that username or email.');
                            break;
                        case 'wrong_password':
                            showError('Incorrect password. Please try again.');
                            break;
                        case 'pending':
                            showError('Your account is awaiting admin approval. Please check back later.');
                            break;
                        case 'rejected':
                            showError('Your registration was not approved. Please contact your administrator.');
                            break;
                        default:
                            showError('Login failed. Please try again.');
                    }
                    return;
                }

                // Success — set session and redirect
                var remember = document.getElementById('rememberMe').checked;
                DigifinwizAuth.setSession(result.user, remember);
                DigifinwizDB.recordLastLogin(result.user.id).catch(function(){});

                if (result.user.role === 'admin') {
                    window.location.replace('admin.html');
                } else {
                    window.location.replace('index.html');
                }
            }).catch(function(err) {
                console.error('Login error:', err);
                loginBtn.disabled    = false;
                loginBtn.textContent = 'Login';
                showError('An error occurred. Please try again.');
            });
        });
    </script>
</body>
</html>
